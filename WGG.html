<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Guessing Game</title>
    <link rel="stylesheet" href="WGG.css">

</head>
<body>
    <div class="card">
        <h1>Guess the Word</h1>
        <p><b>Hint:</b> A programming language</p>

        <p id="displayWord" style="font-size: 24px; letter-spacing: 5px;"></p>

        <p>
            Guess One letter:
            <input type="text" maxlength="1" id="letter-input">
        </p>

        <button onclick="guessLetter()">Submit</button>
    </div>

    <!-- MOVE SCRIPT HERE -->
    <script src="./WGG.js"></script>
</body>

</html>
