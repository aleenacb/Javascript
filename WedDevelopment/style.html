<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Style</title>
</head>
<style>
    body {
        background-color: #f0f0f0;
        font-family: 'Times New Roman', Times, serif;
        text-align: center;
    }
    h1 {
        color: #258D46;
        font-size: 48px;
        margin-bottom: 20px;
        text-shadow: 2px 2px;
    }
    p {
        color: #D35400;
        font-size: 20px;
        line-height: 1.6;
    }
</style>
<body>
    <h1>Welcome to the CSS</h1>
    <p>This is a beautifully styled paragraph</p>
</body>
</html>
