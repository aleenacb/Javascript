<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Events</title>
</head>
<body>
    <script>
        function myfunc() {
            document.getElementById("Aleena").innerHTML = "Welcome to JS";
        }
    </script>
    <button onclick="myfunc()">Click Me</button>
    <button onclick="alert('Button Clicked')">Hi</button>
    <p id="Aleena"></p>
</body>
</html>
